# Saturday Morning commercials list.
#
# The owner chooses which Internet Archive items to use. Replace each
# REPLACE_ME identifier with a real item identifier: the part after /details/
# in an archive.org URL, e.g. https://archive.org/details/<identifier>.
# The builder refuses to run while any placeholder remains.
#
# Every video file in an item becomes one commercial. Narrow an item with
# case-insensitive glob patterns matched against the file name:
#   include = ["*1983*"]   only files matching at least one pattern
#   exclude = ["*promo*"]  drop files matching any pattern
#
# Removing an item from this list removes its .strm files on the next run.

# Seconds to wait between archive.org requests (be polite).
delay_seconds = 1.0

[[item]]
identifier = "REPLACE_ME_first_collection"

[[item]]
identifier = "REPLACE_ME_second_collection"
include = ["*.mp4"]
exclude = ["*sample*"]
